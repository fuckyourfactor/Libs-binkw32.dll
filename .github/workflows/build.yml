name: Build binkw32.dll (FFmpeg, Windows x86)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FFMPEG_VERSION: '7.1.5'
      UPX_VERSION: '5.3.0'
      FFMPEG_BUILD_ROOT: ${{ github.workspace }}/.build-ffmpeg
      FFMPEG_PREFIX: ${{ github.workspace }}/.build-ffmpeg/prefix
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Windows x86 cross compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686-win32 binutils-mingw-w64-i686 \
            cmake ninja-build make pkgconf curl xz-utils python3 nasm
          i686-w64-mingw32-gcc --version

      - name: Run portable unit tests before the cross-build
        run: |
          cmake -S . -B build-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBINK_WITH_FFMPEG=OFF -DBINK_BUILD_TESTS=ON
          cmake --build build-native --parallel 4
          ctest --test-dir build-native --output-on-failure

      - name: Restore minimal FFmpeg libraries from cache
        uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: .build-ffmpeg/prefix
          key: ffmpeg-bink-x86-${{ runner.os }}-${{ env.FFMPEG_VERSION }}-${{ hashFiles('tools/build_ffmpeg_mingw32.sh') }}

      - name: Build only the required FFmpeg Bink codecs and conversion libraries
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash tools/build_ffmpeg_mingw32.sh

      - name: Verify minimal FFmpeg installation
        run: |
          for module in avcodec avutil swscale swresample; do
            test -s "$FFMPEG_PREFIX/lib/lib${module}.a"
          done
          test ! -e "$FFMPEG_PREFIX/lib/libavformat.a"

      - name: Configure replacement DLL with FFmpeg enabled
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/.build-ffmpeg/prefix/lib/pkgconfig
          PKG_CONFIG_PATH: ''
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: '1'
        run: |
          cmake -S . -B build-win32-ffmpeg -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw32.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBINK_WITH_FFMPEG=ON \
            -DBINK_FFMPEG_STATIC=ON \
            -DBINK_MINIMIZE_SIZE=ON \
            -DBINK_ENABLE_TRACE=OFF \
            -DBINK_BUILD_TESTS=OFF

          cmake --build build-win32-ffmpeg --target binkw32 --parallel 4 --verbose

      - name: Check MinGW export spelling and relink only if necessary
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/.build-ffmpeg/prefix/lib/pkgconfig
          PKG_CONFIG_PATH: ''
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: '1'
        shell: bash
        run: |
          set -euo pipefail

          mode="$(python3 tools/choose_mingw_def.py \
            tools/exports.json build-win32-ffmpeg/binkw32.dll)"
          echo "MinGW export name adjustment: $mode"
          if [[ "$mode" != verified ]]; then
            cmake -S . -B build-win32-ffmpeg -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw32.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DBINK_WITH_FFMPEG=ON \
              -DBINK_FFMPEG_STATIC=ON \
              -DBINK_MINIMIZE_SIZE=ON \
              -DBINK_ENABLE_TRACE=OFF \
              -DBINK_BUILD_TESTS=OFF \
              -DBINK_MINGW_PUBLIC_NAME_PREFIX="$mode"
            cmake --build build-win32-ffmpeg --target binkw32 --parallel 4 --verbose
          fi

          python3 tools/check_def.py src/binkw32.def \
            tools/exports.json build-win32-ffmpeg/binkw32.dll

      - name: Install pinned UPX executable packer
        run: |
          curl -fL --retry 3 \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" \
            -o /tmp/upx.tar.xz
          echo '79cea8a50b6fa102d10c7b79a419cd77dead3cc2d78661de2dc5e5815dc505c1  /tmp/upx.tar.xz' | sha256sum --check --status
          mkdir -p /tmp/upx
          tar -xJf /tmp/upx.tar.xz -C /tmp/upx
          install -m 755 "/tmp/upx/upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/upx
          upx --version

      - name: Verify PE32, exact exports, static multimedia link, and filename
        run: |
          python3 tools/check_win32_dll.py \
            build-win32-ffmpeg/binkw32.dll \
            --require-static-ffmpeg \
            --cmake-cache build-win32-ffmpeg/CMakeCache.txt
          i686-w64-mingw32-strip --strip-unneeded build-win32-ffmpeg/binkw32.dll
          python3 tools/check_win32_dll.py \
            build-win32-ffmpeg/binkw32.dll \
            --require-static-ffmpeg \
            --cmake-cache build-win32-ffmpeg/CMakeCache.txt
          mkdir -p dist
          install -m 644 build-win32-ffmpeg/binkw32.dll dist/binkw32.dll
          bash tools/pack_dll.sh dist/binkw32.dll build-win32-ffmpeg/CMakeCache.txt
          python3 tools/check_win32_dll.py \
            dist/binkw32.dll \
            --require-static-ffmpeg \
            --cmake-cache build-win32-ffmpeg/CMakeCache.txt
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          sha256sum dist/binkw32.dll

      - name: Downloadable output (exactly binkw32.dll)
        uses: actions/upload-artifact@v7
        with:
          path: dist/binkw32.dll
          archive: false
          if-no-files-found: error

      - name: Publish standalone DLL asset to GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/binkw32.dll --clobber
